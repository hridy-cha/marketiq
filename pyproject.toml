[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketiq"
version = "0.1.0"
description = "MarketIQ: explainable AI-assisted stock research platform (built on FinRL-X infrastructure)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.3",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0"]
llm = ["openai>=1.40"]
postgres = ["psycopg[binary]>=3.1"]
broker = ["alpaca-py>=0.13"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
marketiq = "marketiq.cli:app"

[tool.setuptools.packages.find]
include = ["marketiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
